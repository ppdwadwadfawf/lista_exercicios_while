<script>
    //Problema: Inversão de Número
    /*
    Escreva um programa que peça ao usuário um número e inverta sua ordem usando uma estrutura de repetição while.
    Exemplo:
    Entrada: 12345
    Saída: 54321
    */

    // problema: inverter numero

    let num = prompt("digite um numero:");
    let invertido = "";
    let i = num.length - 1;

    while (i >= 0) {
        invertido = invertido + num[i];
        i = i - 1;
    }

    alert("invertido: " + invertido);



</script>
