<meta charset="UTF-8">
<script>
    /*
    PROBLEMA: AUMENTO DA POPULAÇÃO
    Supondo que a população de um país A seja da ordem de 80000 habitantes com uma taxa anual de crescimento de 3% e que a população de B seja 200000 habitantes com uma taxa de crescimento de 1.5%. Faça um programa que calcule e escreva o número de anos necessários para que a população do país A ultrapasse ou iguale a população do país B, mantidas as taxas de crescimento.
    */

    //ENTRADA
        let populacao1 = 80000;
        let taxaCrescimentoA = 0.03;
        let populacao2 = 200000;
        let taxaCrescimentoB = 0.015;
        let anos = 0;


    //PROCESSAMENTO
    while (populacao1 < populacao2) {
        populacao1 += populacao1 * taxaCrescimentoA;
        populacao2 += populacao2 * taxaCrescimentoB;
        anos++;
    }

    //SAÍDA
    alert("Após " + anos + " anos, a população do país 1 será de " + Math.round(populacao1) + " habitantes.");
    alert("Após " + anos + " anos, a população do país 2 será de " + Math.round(populacao2) + " habitantes.");

</script>
