<meta charset="UTF-8">
<script>
    /*
    PROBLEMA: URNA ELETRÔNICA
    Faça um programa que simule a urna eletrônica.
    A tela a ser apresentada deverá ser da seguinte forma:
    As opções são:
    1. Candidato Joãozinho
    2. Candidato Mariazinha
    3. Nulo
    4. Branco
    Entre com o seu voto:

    O programa deverá ler os votos dos eleitores e, quando for entrado o número 0, apresentar as seguintes
    informações:
    a) O número de votos de cada candidato;
    b) A porcentagem de votos nulos;
    c) A porcentagem de votos brancos;
    d) O candidato vencedor.
    */


    // PROBLEMA: URNA ELETRÔNICA

    let voto;
    let votosJoaozinho = 0;
    let votosMariazinha = 0;
    let votosNulos = 0;
    let votosBrancos = 0;
    let totalVotos = 0;

    do {
        voto = Number(prompt(
            "As opções são:\n" +
            "1. Candidato Joãozinho\n" +
            "2. Candidato Mariazinha\n" +
            "3. Nulo\n" +
            "4. Branco\n" +
            "0. Sair\n\n" +
            "Entre com o seu voto:"
        ));

        switch (voto) {
            case 1:
                votosJoaozinho++;
                totalVotos++;
                break;

            case 2:
                votosMariazinha++;
                totalVotos++;
                break;

            case 3:
                votosNulos++;
                totalVotos++;
                break;

            case 4:
                votosBrancos++;
                totalVotos++;
                break;

            case 0:
                break;

            default:
                alert("Voto inválido! Tente novamente.");
        }
    } while (voto !== 0);

    // Cálculos das porcentagens
    let porcentNulos = (votosNulos / totalVotos) * 100;
    let porcentBrancos = (votosBrancos / totalVotos) * 100;

    // Determinar o vencedor
    let vencedor = "";

    if (votosJoaozinho > votosMariazinha) {
        vencedor = "Joãozinho";
    } else if (votosMariazinha > votosJoaozinho) {
        vencedor = "Mariazinha";
    } else {
        vencedor = "Empate";
    }

    // Exibir resultado final
    alert(
        "RESULTADO FINAL\n\n" +
        "Votos Joãozinho: " + votosJoaozinho + "\n" +
        "Votos Mariazinha: " + votosMariazinha + "\n" +
        "Votos Nulos: " + votosNulos + " (" + porcentNulos.toFixed(2) + "%)\n" +
        "Votos Brancos: " + votosBrancos + " (" + porcentBrancos.toFixed(2) + "%)\n\n" +
        "Candidato vencedor: " + vencedor
    );





</script>
