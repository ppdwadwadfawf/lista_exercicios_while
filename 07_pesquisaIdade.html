<meta charset="UTF-8">
<script>
    /*
    PROBLEMA: PESQUISA DE IDADE
    Foi feita uma pesquisa entre os habitantes de uma região. Foram coletados os dados de idade, sexo (M/F) e salário. Faça um programa que calcule e mostre:

    a) A média dos salários do grupo;
    b) A maior e a menor idade do grupo;
    c) A quantidade de mulheres na região;
    d) A idade e o sexo da pessoa que possui o menor salário;

    Finalize a entrada de dados ao ser digitada uma idade negativa.
    */

        let totalSalarios = 0;
        let contadorPessoas = 0;
        let maiorIdade = -Infinity;
        let menorIdade = Infinity;
        let quantidadeMulheres = 0;
        let menorSalario = Infinity;
        let idadeMenorSalario = null;
        let sexoMenorSalario = null;

        while (true) {
            let idade = Number(prompt("Digite a idade (negativa para sair): "));
            if (idade < 0) {
                break;
            }

            let sexo = prompt("Digite o sexo ('M' ou 'F'): ").toUpperCase();
            let salario = Number(prompt("Digite o salário: "));

            totalSalarios += salario;
            contadorPessoas++;

            if (idade > maiorIdade) {
                maiorIdade = idade;
            }
            if (idade < menorIdade) {
                menorIdade = idade;
            }
            if (sexo === 'F') {
                quantidadeMulheres++;
            }
            if (salario < menorSalario) {
                menorSalario = salario;
                idadeMenorSalario = idade;
                sexoMenorSalario = sexo;
            }
        }


    
        let mediaSalarios = totalSalarios / contadorPessoas;

        alert("Média dos salários do grupo: " + mediaSalarios.toFixed(2));
        alert("Maior idade do grupo: " + maiorIdade);
        alert("Menor idade do grupo: " + menorIdade);
        alert("Quantidade de mulheres na região: " + quantidadeMulheres);
        alert("Idade da pessoa com o menor salário: " + idadeMenorSalario + ", Sexo: " + sexoMenorSalario);

</script>
